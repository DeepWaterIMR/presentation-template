project:
  title: "SPiCT assessment model for Northeast Arctic beaked redfish"
  subtitle: "A rerenderable presentation example driven by the 2026 SPiCT summary"
  authors:
    - "Mikko Vihtakari"
  organisation: "Institute of Marine Research"
  meeting: "JRN-AFWG"
  date: "2026-06-01"
  story: "The presentation is generated from the same compact SPiCT summary object used by the assessment documents, so updated model results flow into the slides after rerender."

data:
  adapter: "spict"
  summary_file: "data/model_output/spict_summaries/sum_beaked_redfish_spict_2026.rds"

render:
  output_file: "reb-spict-example.html"
  output_dir: "examples/reb-spict/preview"
