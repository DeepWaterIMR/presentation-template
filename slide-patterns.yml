patterns:
  - id: title-slide
    title: Minimal title slide
    category: Foundations
    proof_object: Title, authors, meeting, and date
    use: Open with the decision, question, or subject before adding evidence.
    classes: [title-slide]
    caveat: Keep the title short enough to remain dominant and do not turn the opening into an agenda.
    source_marker: title-slide
    preview: title-slide.png
  - id: process-flow
    title: Three-step claim spine
    category: Foundations
    proof_object: Question, evidence, and implication
    use: Show the audience what to listen for before presenting details.
    classes: [process-flow, flow-step]
    caveat: Use three genuinely distinct steps; do not split one sentence across decorative cards.
    source_marker: process-flow
    preview: process-flow.png
  - id: provenance-grid
    title: Reproducible workflow grid
    category: Foundations
    proof_object: Data and rendering provenance
    use: Explain how analysis outputs become a rerenderable deck.
    classes: [grid-2, card]
    caveat: Name stable project-relative inputs rather than local machine paths.
    source_marker: provenance-grid
    preview: provenance-grid.png
  - id: metric-grid
    title: Metric cards
    category: Evidence
    proof_object: A few comparable values
    use: Summarize two or three decision-relevant metrics at a glance.
    classes: [metric-grid, metric-card]
    caveat: Cards are for comparable values, not unrelated facts that happen to fit.
    source_marker: metric-grid
    preview: metric-grid.png
  - id: text-figure
    title: Text beside a dominant figure
    category: Evidence
    proof_object: One chart with interpretation
    use: Keep concise interpretation visible beside the main empirical result.
    classes: [text-figure, text-panel, figure-panel]
    caveat: The figure must remain the dominant object; move detailed explanation into notes.
    source_marker: text-figure
    preview: text-figure.png
  - id: layout-selection
    title: Choose a layout by proof object
    category: Foundations
    proof_object: Layout decision guide
    use: Compare the core grid, metric, and table choices before building a slide.
    classes: [grid-3, card]
    caveat: This is a template-learning slide and should normally be removed from a project deck.
    source_marker: layout-selection
    preview: layout-selection.png
  - id: diagnostic-grid
    title: Diagnostic cards
    category: Explanation
    proof_object: A compact map of technical checks
    use: Introduce a small set of diagnostics before showing dense diagnostic figures.
    classes: [diagnostic-grid, diagnostic-card]
    caveat: State what each diagnostic changes; do not present checks as unexplained scores.
    source_marker: diagnostic-grid
    preview: diagnostic-grid.png
  - id: emphasis-components
    title: Caveats and conclusions
    category: Decision
    proof_object: Warning, takeaways, deadline, and closing line
    use: Separate risks, conclusions, timing, and sign-off with restrained emphasis.
    classes: [alert-box, takeaway-grid, deadline, closing]
    caveat: These components lose meaning when every statement receives emphasis.
    source_marker: emphasis-components
    preview: emphasis-components.png
  - id: fit-narrow
    title: Full-height edge figure
    category: Evidence
    proof_object: Portrait or landscape figure beside narrow text
    use: Let one large figure run to the slide edge while constraining the text zone.
    classes: [fit-narrow, fit-results, absolute]
    caveat: Recheck overflow whenever slide centering or the canvas ratio changes.
    source_marker: fit-narrow
    preview: fit-narrow.png
  - id: figure-swap
    title: Swap figures in place
    category: Sequence
    proof_object: Two scenarios or variants in one position
    use: Compare two figures without moving the audience's eye.
    classes: [r-stack, fragment, fade-out, fade-in]
    caveat: Give both fragments the same index and ensure the first figure fades out.
    source_marker: figure-swap
    preview: figure-swap.png
  - id: figure-walkthrough
    title: Multi-step figure walkthrough
    category: Sequence
    proof_object: Synchronized bullets and figures
    use: Pace a three-step argument with one text cue and one figure per click.
    classes: [columns, r-stack, fragment, fade-in-then-out]
    caveat: Every intermediate transparent figure must fade out or earlier figures will show through.
    source_marker: figure-walkthrough
    preview: figure-walkthrough.png
  - id: concept-hub
    title: Hub-and-spoke concept diagram
    category: Explanation
    proof_object: A central concept and contributing pieces
    use: Recreate a simple conceptual system as crisp, editable HTML and CSS.
    classes: [concept-diagram, concept-hub-grid, concept-hub]
    caveat: Use an image instead when the source is a genuine external scientific figure.
    source_marker: concept-hub
    preview: concept-hub.png
  - id: table-with-figure
    title: Compact table with a figure
    category: Evidence
    proof_object: Exact values plus a small visual check
    use: Pair a narrow table with a compact trend or consistency check.
    classes: [scenario-figure]
    caveat: Keep the chart subordinate so table text stays readable from the back of the room.
    source_marker: table-with-figure
    preview: table-with-figure.png
  - id: wide-figure
    title: Wide figure with concise text
    category: Evidence
    proof_object: A chart that needs two-thirds of the slide
    use: Give a dense chart more room while retaining a short interpretation column.
    classes: [text-figure, figure-wide-right]
    caveat: Reduce text before reducing the figure below a legible size.
    source_marker: wide-figure
    preview: wide-figure.png
  - id: map-layout
    title: Balanced map layout
    category: Evidence
    proof_object: Map with location context
    use: Reserve balanced space for geographic explanation and a readable map.
    classes: [text-figure, map-slide]
    caveat: Keep legends and labels at least 16 pt and avoid crowding the mapped area.
    source_marker: map-layout
    preview: map-layout.png
  - id: absolute-figure
    title: Figure-heavy columns
    category: Evidence
    proof_object: Large chart reaching toward the slide edge
    use: Combine Reveal columns with an absolute figure when a balanced grid would crowd the proof.
    classes: [columns, column, absolute]
    caveat: Use this supported column pattern instead of unrelated freehand offsets.
    source_marker: absolute-figure
    preview: absolute-figure.png
  - id: background-art
    title: Decorative background art
    category: Explanation
    proof_object: Wide decorative graphic behind concise text
    use: Place a full-width decorative graphic behind content without competing with the message.
    classes: [background-art]
    caveat: Suppress the section watermark and inset labels so neither lands on the artwork edge.
    source_marker: background-art
    preview: background-art.png
  - id: custom-font
    title: Bundled custom font
    category: Explanation
    proof_object: Hand-drawn annotation inside a generated figure
    use: Add occasional hand-drawn labels without requiring a system font installation.
    classes: [custom-font-demo]
    caveat: Register the bundled font and render with ragg; the default quartz PNG device ignores it.
    source_marker: custom-font
    preview: custom-font.png
  - id: table-variants
    title: Medium and tight tables
    category: Evidence
    proof_object: Exact multi-column values
    use: Select a named table size according to column count and explanation density.
    classes: [table-medium, table-tight]
    caveat: If a table still needs tiny text, move detail to an appendix instead.
    source_marker: table-variants
    preview: table-variants.png
  - id: scenario-table
    title: Decision-facing scenario table
    category: Decision
    proof_object: Exact scenario comparison
    use: Compare a small number of management or model scenarios in one table.
    classes: [table-medium, takeaway]
    caveat: Keep only the columns needed for the decision and move the full table to an appendix.
    source_marker: scenario-table
    preview: scenario-table.png
  - id: takeaway-grid
    title: Three-card conclusion
    category: Decision
    proof_object: Finding, interpretation, and next action
    use: End on the message the audience should remember and what happens next.
    classes: [takeaway-grid, takeaway-card, closing-inline]
    caveat: Do not replace the conclusion with a generic thank-you slide.
    source_marker: takeaway-grid
    preview: takeaway-grid.png
